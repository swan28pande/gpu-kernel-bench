name: ci
on: [push, pull_request]

jobs:
  # GitHub runners have no GPU, so: compile the CUDA/CUTLASS sources with nvcc...
  nvcc-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - run: git clone --depth 1 --branch v3.8.0 https://github.com/NVIDIA/cutlass.git /opt/cutlass
      - name: compile kernels
        run: |
          for f in gpubench/csrc/*.cu; do
            nvcc -std=c++17 -O3 --expt-relaxed-constexpr -arch=sm_80 \
              -I/opt/cutlass/include -I/opt/cutlass/tools/util/include -c "$f" -o /tmp/$(basename "$f").o
          done

  # ...and check the Triton kernels' correctness on CPU via the Triton interpreter.
  triton-interpret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install triton numpy && pip install --no-deps -e .
      - run: python -m gpubench check --quick
        env:
          TRITON_INTERPRET: "1"
