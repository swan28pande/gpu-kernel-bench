name: ci
on: [push, pull_request]

jobs:
  # GitHub runners have no GPU, so: compile the CUDA/CUTLASS sources with nvcc...
  nvcc-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/cutlass
          ref: v3.8.0
          path: third_party/cutlass
      - name: compile kernels
        run: |
          set -e
          for f in gpubench/csrc/*.cu; do
            nvcc -std=c++17 -O3 --expt-relaxed-constexpr -arch=sm_80 \
              -Ithird_party/cutlass/include -Ithird_party/cutlass/tools/util/include \
              -c "$f" -o /tmp/$(basename "$f").o
          done

  # ...and check the Triton kernels' correctness on CPU via the Triton interpreter.
  triton-interpret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install triton numpy && pip install --no-deps -e .
      - run: python -m gpubench check --quick
        env:
          TRITON_INTERPRET: "1"
