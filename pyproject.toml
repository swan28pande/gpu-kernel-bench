[project]
name = "gpu-kernel-bench"
version = "0.1.0"
description = "Benchmark, profile and correctness-check custom CUDA, CUTLASS and Triton kernels"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "triton>=3.0; sys_platform == 'linux'",
    "ninja",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gpubench"]

[tool.setuptools.package-data]
gpubench = ["csrc/*"]
